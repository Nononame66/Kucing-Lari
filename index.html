<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#f6b93b">
  <title>Lebah Lari 🐝</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div class="hud-box"><small>LEVEL</small><b id="level">1</b></div>
      <div class="hud-box"><small>SKOR</small><b id="score">0</b></div>
      <div class="hud-box"><small>TERBAIK</small><b id="highscore">0</b></div>
    </div>

    <button id="pauseBtn" class="icon-btn" aria-label="Pause">Ⅱ</button>

    <section id="menu" class="overlay">
      <div class="card">
        <div class="logo">🐝</div>
        <h1>LEBAH LARI</h1>
        <p>Seberapa jauh kamu bisa membantu lebah pulang ke sarangnya?</p>
        <button id="startBtn" class="main-btn">MULAI</button>
        <div class="help">
          <span>⌨️ PC: WASD / Arrow</span>
          <span>📱 HP: Swipe / tombol arah</span>
        </div>
      </div>
    </section>

    <section id="pauseMenu" class="overlay hidden">
      <div class="card">
        <h2>⏸ PAUSE</h2>
        <button id="resumeBtn" class="main-btn">LANJUT</button>
        <button id="restartPauseBtn" class="secondary-btn">ULANGI</button>
      </div>
    </section>

    <section id="gameOver" class="overlay hidden">
      <div class="card">
        <div class="logo">💥</div>
        <h2>LEBAH TERJATUH!</h2>
        <p>Skor kamu: <b id="finalScore">0</b></p>
        <p>Level: <b id="finalLevel">1</b></p>
        <p>High Score: <b id="finalHigh">0</b></p>
        <button id="restartBtn" class="main-btn">MAIN LAGI</button>
      </div>
    </section>

    <div id="touch-controls" aria-label="Kontrol">
      <button data-dir="up">▲</button>
      <button data-dir="left">◀</button>
      <button data-dir="down">▼</button>
      <button data-dir="right">▶</button>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
